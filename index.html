function mkWizard(){return {step:1,sourceType:'zip',file:null,repo:'',name:'',icon:'✦',iconData:'',packageName:'',autoPackage:true,format:'apk'}}
function wizardView(){if(!state.wizard)state.wizard=mkWizard();let w=state.wizard,t=tr(),p=[];for(let i=1;i<=6;i++)p.push(`<span class="${i<=w.step?'done':''}"></span>`);let body='';
 if(w.step===1)body=`<div class="step-kicker">${t.stepOf} 1 / 6</div><h2 class="step-title">${t.sourceTitle}</h2><p class="step-note">${t.sourceDesc}</p><div class="source-tabs"><button class="source-tab ${w.sourceType==='zip'?'selected':''}" data-source="zip"><strong>▣ ${t.zip}</strong><small>HTML · Android · Flutter</small></button><button class="source-tab ${w.sourceType==='github'?'selected':''}" data-source="github"><strong>⑂ ${t.github}</strong><small>Public repository</small></button></div>${w.sourceType==='zip'?`<div class="dropzone" id="dropzone"><div class="upload-icon">⇧</div><strong>${w.file?esc(w.file.name):t.drop}</strong><span>${w.file?`${(w.file.size/1048576).toFixed(1)} MB`:t.zipLimit}</span><input id="zipInput" type="file" accept=".zip,application/zip" hidden></div>`:`<div class="field"><label>${t.repo}</label><input id="repoInput" class="input" placeholder="https://github.com/user/project" value="${esc(w.repo)}"><div class="helper">${t.repoHint}</div></div>`}`;

function genPackage(name){let slug=(name||'myapp').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,22)||'myapp';return `com.apkmaker.${slug}`}
function bindWizard(){let w=state.wizard;document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>{w.sourceType=b.dataset.source;wizardView()});let dz=document.getElementById('dropzone'),zi=document.getElementById('zipInput');if(dz&&zi){dz.onclick=e=>{if(e.target!==zi)zi.click()};zi.onclick=e=>e.stopPropagation();zi.onchange=()=>setZip(zi.files?.[0]);dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');setZip(e.dataTransfer.files?.[0])}}
 let ri=document.getElementById('repoInput');if(ri)ri.oninput=()=>w.repo=ri.value;let ni=document.getElementById('nameInput');if(ni)ni.oninput=()=>{w.name=ni.value;if(w.autoPackage){w.packageName=genPackage(w.name)}};let ii=document.getElementById('iconInput');if(ii)ii.onchange=()=>{let f=ii.files?.[0];if(f){if(f.size>5*1024*1024)return msg(state.lang==='ar'?'حجم الأيقونة يجب أن يقل عن ٥ ميجابايت':'Icon must be under 5 MB');let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=96;c.height=96;let ctx=c.getContext('2d'),scale=Math.min(96/im.width,96/im.height),ww=im.width*scale,hh=im.height*scale;ctx.drawImage(im,(96-ww)/2,(96-hh)/2,ww,hh);w.iconData=c.toDataURL('image/png');w.icon='';wizardView()};im.src=reader.result};reader.readAsDataURL(f)}};document.querySelectorAll('[data-icon]').forEach(b=>b.onclick=()=>{w.icon=b.dataset.icon;let c=document.createElement('canvas');c.width=96;c.height=96;let ctx=c.getContext('2d');ctx.fillStyle='#0e2c22';ctx.fillRect(0,0,96,96);ctx.fillStyle='#35d69b';ctx.font='52px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(w.icon,48,49);w.iconData=c.toDataURL('image/png');wizardView()});let pi=document.getElementById('packageInput');if(pi&&!w.autoPackage)pi.oninput=()=>w.packageName=pi.value;let ap=document.getElementById('autoPkg');if(ap)ap.onchange=()=>{w.autoPackage=ap.checked;if(w.autoPackage)w.packageName=genPackage(w.name);wizardView()};document.querySelectorAll('[data-format]').forEach(b=>b.onclick=()=>{w.format=b.dataset.format;wizardView()});document.getElementById('prevStep').onclick=()=>{if(w.step>1){w.step--;wizardView()}};document.getElementById('nextStep').onclick=()=>{if(!validStep())return;w.step++;wizardView()};let cr=document.getElementById('createApp');if(cr)cr.onclick=createProject}

function validStep(){let w=state.wizard,t=tr();if(w.step===1){if(w.sourceType==='zip'&&!w.file){msg(t.selectSource);return false}if(w.sourceType==='github'&&!/^https:\/\/github\.com\/[\w.-]+\/[\w.-]+\/?$/.test(w.repo)){msg(t.invalidRepo);return false}}if(w.step===2&&!w.name.trim()){msg(t.invalidName);return false}if(w.step===4){let p=document.getElementById('packageInput')?.value||w.packageName||genPackage(w.name);if(!/^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){1,}$/.test(p)){msg(t.invalidPackage);return false}w.packageName=p}return true}
async function createProject(){if(!validStep())return;let w=state.wizard,proj={id:id(),name:w.name.trim(),icon:w.icon,iconData:w.iconData,packageName:w.packageName||genPackage(w.name),format:w.format,sourceType:w.sourceType,repo:w.repo,fileName:w.file?.name||'',createdAt:new Date().toISOString(),lastStatus:'pending'};state.projects.push(proj);persist();try{let s=await api('/api/state');state.engine=s.engine||{connected:false}}catch{state.engine={connected:false}}if(!state.engine.connected){msg(tr().createdDraft);state.wizard=null;location.hash=`#project/${proj.id}`;return}await startBuild(proj,w.file)}
async function startBuild(proj,file){let b={id:id(),projectId:proj.id,name:proj.name,icon:proj.icon,format:proj.format,status:'pending',createdAt:new Date().toISOString(),verified:false};state.builds.push(b);proj.lastStatus='running';persist();location.hash=`#project/${proj.id}`;try{let form=new FormData();form.append('project',JSON.stringify(proj));if(file)form.append('source',file);let r=await fetch('/api/builds',{method:'POST',body:form});let d=await r.json();if(!r.ok)throw new Error(d.error||tr().createFailure);b.serverId=d.build_id;b.status='running';proj.sourceBuildId=d.build_id;if(d.project_type)proj.projectType=d.project_type;persist();await pollBuild(b,proj)}catch(e){b.status='failed';b.error=e.message||tr().serverError;proj.lastStatus='failed';persist();render();msg(tr().createFailure)}}
async function pollBuild(b,proj){for(let i=0;i<120;i++){await new Promise(r=>setTimeout(r,5000));try{let d=await api('/api/builds/'+encodeURIComponent(b.serverId));if(d.status==='success'&&d.verified&&d.download_url){b.status='success';b.verified=true;b.downloadUrl=d.download_url;proj.lastStatus='success';persist();render();return}if(d.status==='failed'){b.status='failed';b.error=d.error||'';proj.lastStatus='failed';persist();render();return}}catch{} }b.status='running';persist();render()}
async function api(url,opt){let r=await fetch(url,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||tr().serverError);return d}

function setup(){let t=tr();app.innerHTML=`<section class="page-head"><h1>${t.engineTitle}</h1><p>${t.engineDesc}</p></section><div id="engineStatus" class="notice ${state.engine.connected?'good':''}">${state.engine.connected?t.connectedGood:t.engineNotConnected}</div><section class="card engine-card"><h2>✦ ${t.autoSetup}</h2><p>${t.autoDesc}</p><div class="field"><label>${t.token}</label><input id="ghToken" class="input" type="password" autocomplete="new-password" placeholder="ghp_…"><div class="helper">${t.tokenHint}</div></div><button class="btn" id="autoSetup">${t.setupNow}</button></section><section class="card engine-card"><h2>${t.setup}</h2><div class="field"><label>${t.repository}</label><input id="engineRepo" class="input" placeholder="owner/apk-maker-builds" value="${esc(state.engine.repo||'')}"></div><div class="field"><label>${t.token}</label><input id="engineToken" class="input" type="password" autocomplete="new-password" placeholder="ghp_…"></div><button class="btn secondary" id="connectEngine">${t.connect}</button></section><div class="section-head"><div><h2>${t.manual}</h2><p>${t.manualDesc}</p></div></div><section class="card"><div class="steps-list"><article><div><strong>${t.createRepo}</strong><p>${t.manualDesc}</p></div></article><article><div><strong>${t.addWorkflow}</strong><p>${t.noFake}</p></div></article><article><div><strong>${t.connectKeys}</strong><p>${t.tokenHint}</p></div></article></div><div class="section-head"><div><h2>${t.workflow}</h2></div><a class="small-btn" href="build-apk.yml" download>${t.download}</a></div><div class="notice good">${state.lang==='ar'?'ملف سير العمل الكامل الجاهز للتشغيل موجود في build-apk.yml. استخدم زر التنزيل أعلاه لإضافته إلى مستودع البناء الخاص.':'The complete runnable workflow is in build-apk.yml. Use the download link above to add it to your private build repository.'}</div></section>`;document.getElementById('autoSetup').onclick=autoSetup;document.getElementById('connectEngine').onclick=connectEngine}

async function connectEngine(){let repo=document.getElementById('engineRepo').value.trim(),token=document.getElementById('engineToken').value.trim();if(!repo||!token)return msg(tr().setupFail);let btn=document.getElementById('connectEngine');btn.disabled=true;try{let r=await api('/api/engine/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({repo,token})});state.engine={connected:true,repo:r.repository||repo};msg(tr().connectedGood);render()}catch(e){msg(e.message||tr().setupFail);btn.disabled=false}}
function projectPage(pid){let p=state.projects.find(x=>x.id===pid);if(!p){app.innerHTML=`<section class="page-head"><h1>${tr().notFound}</h1><a class="btn" href="#home">${tr().nav[0]}</a></section>`;return}let bs=state.builds.filter(b=>b.projectId===p.id);app.innerHTML=`<section class="page-head"><a class="muted" href="#home">← ${tr().nav[0]}</a><div class="section-head"><div class="project-title"><span class="project-emoji">${p.icon||'✦'}</span><span><h1>${esc(p.name)}</h1><p>${esc(p.packageName)}</p></span></div><button class="small-btn" id="deleteProject">${tr().delete}</button></div></section><section class="card"><div class="summary"><div><small>${tr().source}</small><strong>${esc(p.sourceType==='zip'?p.fileName:p.repo)}</strong></div><div><small>${tr().format}</small><strong>${p.format.toUpperCase()}</strong></div><div><small>${tr().status}</small><strong>${p.lastStatus==='success'?tr().successStatus:p.lastStatus==='failed'?tr().failedStatus:tr().pending}</strong></div><div><small>${tr().date}</small><strong>${new Date(p.createdAt).toLocaleDateString(state.lang==='ar'?'ar':'en')}</strong></div></div><div class="notice">${tr().noFake}</div>${bs.filter(b=>b.status==='failed'&&b.error).map(b=>`<div class="notice bad">${esc(b.error)}</div>`).join('')}<button class="btn" id="rebuild">↻ ${tr().rebuild}</button></section><div class="section-head"><div><h2>${tr().historyTitle}</h2></div></div><section class="card">${buildList(bs)}</section>`;document.getElementById('rebuild').onclick=()=>{if(!state.engine.connected){location.hash='#setup';msg(tr().engineNeeded);return}if(p.sourceType==='zip'&&!p.sourceBuildId){msg(tr().selectSource);location.hash='#new';return}startBuild(p,null)};document.getElementById('deleteProject').onclick=()=>confirmDelete(p.id)}
function confirmDelete(pid){let t=tr();document.getElementById('modalRoot').innerHTML=`<div class="modal-back" id="backdrop"><section class="modal"><h2>${t.delete}</h2><p>${t.confirmDelete}</p><div class="actions"><button class="btn" id="yesDelete">${t.yesDelete}</button><button class="btn secondary" id="cancelDelete">${t.cancel}</button></div></section></div>`;document.getElementById('yesDelete').onclick=()=>{state.projects=state.projects.filter(p=>p.id!==pid);state.builds=state.builds.filter(b=>b.projectId!==pid);persist();document.getElementById('modalRoot').innerHTML='';location.hash='#home';msg(t.deleted)};document.getElementById('cancelDelete').onclick=()=>document.getElementById('modalRoot').innerHTML='';document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')document.getElementById('modalRoot').innerHTML=''}}
function render(){header();let [r,x]=route();if(r==='new')wizardView();else if(r==='builds')history();else if(r==='setup')setup();else if(r==='project')projectPage(x);else if(r==='engine'){home();setTimeout(()=>document.querySelector('.grid-steps')?.scrollIntoView({behavior:'smooth'}),50)}else home()}
document.getElementById('langBtn').onclick=()=>{state.lang=state.lang==='ar'?'en':'ar';localStorage.setItem('ams-lang',state.lang);render()};document.getElementById('themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('ams-theme',state.theme);render()};window.addEventListener('hashchange',()=>{state.wizard=null;render()});render();

async function refreshRemoteState(){try{let s=await api('/api/state');state.engine=s.engine||state.engine;state.builds=s.builds||[];for(const b of state.builds){let p=state.projects.find(x=>x.id===b.projectId);if(p){p.lastStatus=b.status==='success'?'success':b.status==='failed'?'failed':b.status==='running'?'running':'pending'}}persist();render()}catch{}}
