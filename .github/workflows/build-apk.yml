name: APK Maker Studio — Android build
run-name: APKMS-${{ inputs.build_id }} | ${{ inputs.app_name }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Unique build id
        required: true
        type: string
      app_name:
        description: Display name
        required: true
        type: string
      package_name:
        description: Android package id
        required: true
        type: string
      output_format:
        description: apk or aab
        required: true
        type: string
      project_type:
        description: web, android, or flutter
        required: true
        type: string
      source_url:
        description: Public source ZIP URL or repo:<project-folder> or repo:sources/<build_id>.zip
        required: false
        type: string
      icon_data:
        description: Optional small base64 encoded image
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: apkms-${{ inputs.build_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      APP_NAME: ${{ inputs.app_name }}
      PKG: ${{ inputs.package_name }}
      FORMAT: ${{ inputs.output_format }}
      PROJECT_TYPE: ${{ inputs.project_type }}
      SOURCE_URL: ${{ inputs.source_url }}
      ICON_DATA: ${{ inputs.icon_data }}
      BUILD_ID: ${{ inputs.build_id }}
      WORK: ${{ github.workspace }}/work
      OUT: ${{ github.workspace }}/out
    steps:
      - name: Check out private build inputs
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Set up Flutter
        if: inputs.project_type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Node for web projects
        if: inputs.project_type == 'web'
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Fetch and unpack project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK/src" "$WORK/project" "$OUT"
          if [[ "$SOURCE_URL" == repo:* ]]; then
            source_rel="${SOURCE_URL#repo:}"
            if [[ "$source_rel" == *"OWNER/REPO"* || -z "$source_rel" || "$source_rel" == /* || "/$source_rel/" == *"/../"* ]]; then
              echo 'Set source_url to a real repository path such as repo:apps/money-book or a ZIP path.' >&2
              exit 1
            fi
            source_path="$GITHUB_WORKSPACE/$source_rel"
            if [[ -d "$source_path" ]]; then
              cp -R "$source_path"/. "$WORK/project"/
            elif [[ -f "$source_path" ]]; then
              cp "$source_path" "$WORK/source.zip"
            else
              echo "Repository source path does not exist: $source_rel" >&2
              exit 1
            fi
          elif [[ "$SOURCE_URL" == *"OWNER/REPO"* ]]; then
            echo 'Replace OWNER/REPO in the example with the actual public source repository.' >&2
            exit 1
          elif [[ -n "$SOURCE_URL" ]]; then
            curl --fail --location --silent --show-error "$SOURCE_URL" -o "$WORK/source.zip"
          else
            echo 'No project source was provided.' >&2
            exit 1
          fi
          if [[ -f "$WORK/source.zip" ]]; then
            unzip -q "$WORK/source.zip" -d "$WORK/src"
            count=$(find "$WORK/src" -mindepth 1 -maxdepth 1 | wc -l)
            if [[ "$count" -eq 1 ]] && [[ -d "$(find "$WORK/src" -mindepth 1 -maxdepth 1 -type d | head -n1)" ]]; then
              cp -R "$(find "$WORK/src" -mindepth 1 -maxdepth 1 -type d | head -n1)"/. "$WORK/project"/
            else
              cp -R "$WORK/src"/. "$WORK/project"/
            fi
          fi
          echo "SRC=$WORK/project" >> "$GITHUB_ENV"
          echo "Project files: $(find "$WORK/project" -type f | wc -l)"

      - name: Apply app name and package identifier to native projects
        if: inputs.project_type == 'android' || inputs.project_type == 'flutter'
        shell: bash
        run: |
          set -euo pipefail
          NATIVE="$SRC"
          if [[ "$PROJECT_TYPE" == 'flutter' ]]; then NATIVE="$SRC/android"; fi
          python3 - "$NATIVE" "$PKG" "$APP_NAME" <<'PY'
          import pathlib,re,sys,xml.etree.ElementTree as ET
          root=pathlib.Path(sys.argv[1]); pkg=sys.argv[2]; appname=sys.argv[3]
          for f in list(root.rglob('build.gradle'))+list(root.rglob('build.gradle.kts')):
            s=f.read_text(encoding='utf-8',errors='replace')
            s=re.sub(r'(applicationId\s*(?:=\s*)?["\']).*?(["\'])',lambda m:m.group(1)+pkg+m.group(2),s)
            f.write_text(s,encoding='utf-8')
          ns='{http://schemas.android.com/apk/res/android}'
          for f in root.rglob('AndroidManifest.xml'):
            try:
              tree=ET.parse(f); app=tree.getroot().find('application')
              if app is not None: app.set(ns+'label','@string/app_name')
              tree.write(f,encoding='utf-8',xml_declaration=True)
            except ET.ParseError: pass
          for f in root.rglob('strings.xml'):
            try:
              tree=ET.parse(f); res=tree.getroot(); item=next((x for x in res.findall('string') if x.get('name')=='app_name'),None)
              if item is None: item=ET.SubElement(res,'string',{'name':'app_name'})
              item.text=appname; tree.write(f,encoding='utf-8',xml_declaration=True)
            except ET.ParseError: pass
          PY
          RES="$NATIVE/app/src/main/res/values"
          if [[ ! -f "$RES/strings.xml" ]]; then mkdir -p "$RES"; python3 - "$RES/strings.xml" "$APP_NAME" <<'PY'
          import html,sys
          open(sys.argv[1],'w',encoding='utf-8').write('<resources><string name="app_name">'+html.escape(sys.argv[2])+'</string></resources>')
          PY
          fi
          if [[ -n "$ICON_DATA" ]]; then
            ICON="$NATIVE/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
            mkdir -p "$(dirname "$ICON")"
            printf '%s' "$ICON_DATA" | base64 --decode > "$ICON"
            find "$SRC/app/src/main/res" -maxdepth 1 -type d -name 'mipmap-*' ! -name 'mipmap-xxxhdpi' -exec rm -rf {} +
            rm -rf "$SRC/app/src/main/res/mipmap-anydpi" "$SRC/app/src/main/res/mipmap-anydpi-v26"
          fi

      - name: Prepare signing key
        shell: bash
        run: |
          set -euo pipefail
          KS="$WORK/release.keystore"
          PASS="${KEYSTORE_PASSWORD:-apkmaker-studio}"
          ALIAS="${KEY_ALIAS:-apkmaker}"
          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"
          else
            keytool -genkeypair -noprompt -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=APK Maker Studio, O=APK Maker Studio, C=US"
          fi
          echo "KS=$KS" >> "$GITHUB_ENV"
          echo "KS_PASS=$PASS" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$ALIAS" >> "$GITHUB_ENV"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Build web project as an Android WebView app
        if: inputs.project_type == 'web'
        shell: bash
        run: |
          set -euo pipefail
          SRC="$SRC" npm --version
          if [[ -f "$SRC/package.json" ]]; then
            cd "$SRC"
            if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
            npm run build --if-present
          fi
          WEBROOT="$SRC"
          for candidate in "$SRC/dist" "$SRC/build" "$SRC/www" "$SRC/out"; do
            if [[ -f "$candidate/index.html" ]]; then WEBROOT="$candidate"; break; fi
          done
          [[ -f "$WEBROOT/index.html" ]] || { echo 'No index.html found in the web project.' >&2; exit 1; }
          APP="$WORK/android-wrapper"
          PKG_PATH="${PKG//./\/}"
          mkdir -p "$APP/app/src/main/java/$PKG_PATH" "$APP/app/src/main/res/values" "$APP/app/src/main/res/mipmap-xxxhdpi" "$APP/app/src/main/assets/www"
          cp -R "$WEBROOT"/. "$APP/app/src/main/assets/www/"
          cat > "$APP/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'WrappedApp'
          include ':app'
          EOF
          cat > "$APP/build.gradle" <<'EOF'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          EOF
          cat > "$APP/gradle.properties" <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF
          cat > "$APP/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace System.getenv('PKG')
            compileSdk 35
            defaultConfig { applicationId System.getenv('PKG'); minSdk 23; targetSdk 35; versionCode 1; versionName '1.0.0' }
            buildTypes { release { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.7.0'; implementation 'androidx.webkit:webkit:1.12.1' }
          EOF
          python3 - "$APP" "$PKG" "$APP_NAME" <<'PY'
          import html, os, pathlib, sys
          app=pathlib.Path(sys.argv[1]); pkg=sys.argv[2]; title=html.escape(sys.argv[3], quote=True)
          manifest=f'''<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:allowBackup="false" android:icon="@mipmap/ic_launcher" android:label="{title}" android:supportsRtl="true"><activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>'''
          (app/'app/src/main/AndroidManifest.xml').write_text(manifest,encoding='utf-8')
          (app/'app/src/main/java'/pathlib.Path(pkg.replace('.','/'))/'MainActivity.java').write_text(f'''package {pkg};
          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {{
            private WebView view;
            @SuppressLint("SetJavaScriptEnabled") public void onCreate(Bundle b) {{ super.onCreate(b); view=new WebView(this); WebSettings s=view.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); view.setWebViewClient(new WebViewClient()); view.loadUrl("file:///android_asset/www/index.html"); setContentView(view); }}
            @Override public void onBackPressed() {{ if(view!=null&&view.canGoBack()) view.goBack(); else super.onBackPressed(); }}
          }}''',encoding='utf-8')
          (app/'app/src/main/res/values/strings.xml').write_text(f'<resources><string name="app_name">{title}</string></resources>',encoding='utf-8')
          PY
          if [[ -n "$ICON_DATA" ]]; then printf '%s' "$ICON_DATA" | base64 --decode > "$APP/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"; fi
          if [[ ! -s "$APP/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" ]]; then
            python3 - "$APP/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" <<'PY'
          import struct,sys,zlib
          n=432; row=b'\0'+bytes([53,214,155,255])*n; raw=row*n
          def ch(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          p=b'\x89PNG\r\n\x1a\n'+ch(b'IHDR',struct.pack('>IIBBBBB',n,n,8,6,0,0,0))+ch(b'IDAT',zlib.compress(raw,9))+ch(b'IEND',b'')
          open(sys.argv[1],'wb').write(p)
          PY
          fi
          cd "$APP"
          if [[ "$FORMAT" == 'aab' ]]; then
            gradle --no-daemon bundleRelease
            find app/build/outputs/bundle/release -name '*.aab' -print -quit | xargs -r -I{} cp {} "$OUT/$BUILD_ID.aab"
          else
            gradle --no-daemon assembleRelease
            find app/build/outputs/apk/release -name '*.apk' -print -quit | xargs -r -I{} cp {} "$OUT/$BUILD_ID.apk"
          fi

      - name: Build existing Android project
        if: inputs.project_type == 'android'
        shell: bash
        run: |
          set -euo pipefail
          APP="$WORK/android-project"; mkdir -p "$APP"; cp -R "$SRC"/. "$APP"/
          GRADLEW=$(find "$APP" -maxdepth 3 -name gradlew -print -quit)
          if [[ "$FORMAT" == 'aab' ]]; then TASK=bundleRelease; PATTERN='*/outputs/bundle/release/*.aab'; EXT=aab; else TASK=assembleRelease; PATTERN='*/outputs/apk/release/*.apk'; EXT=apk; fi
          if [[ -n "$GRADLEW" ]]; then chmod +x "$GRADLEW"; cd "$(dirname "$GRADLEW")"; ./gradlew --no-daemon "$TASK"
          else cd "$APP"; gradle --no-daemon "$TASK"; fi
          FILE=$(find "$APP" -path "$PATTERN" -print -quit)
          [[ -n "$FILE" ]] || { echo "Gradle did not produce the requested $EXT." >&2; exit 1; }
          cp "$FILE" "$OUT/$BUILD_ID.$EXT"

      - name: Build Flutter project
        if: inputs.project_type == 'flutter'
        shell: bash
        run: |
          set -euo pipefail
          APP="$WORK/flutter-project"; mkdir -p "$APP"; cp -R "$SRC"/. "$APP"/; cd "$APP"
          flutter pub get
          if [[ "$FORMAT" == 'aab' ]]; then flutter build appbundle --release; cp build/app/outputs/bundle/release/*.aab "$OUT/$BUILD_ID.aab"
          else flutter build apk --release; cp build/app/outputs/flutter-apk/app-release.apk "$OUT/$BUILD_ID.apk"; fi

      - name: Sign and verify package
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(find "$OUT" -maxdepth 1 -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit)
          [[ -n "$FILE" && -s "$FILE" ]] || { echo 'No Android package was produced.' >&2; exit 1; }
          if [[ "$FILE" == *.apk ]]; then
            TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
            "$TOOLS/zipalign" -f -p 4 "$FILE" "$WORK/aligned.apk"
            "$TOOLS/apksigner" sign --ks "$KS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --out "$WORK/signed.apk" "$WORK/aligned.apk"
            mv "$WORK/signed.apk" "$FILE"
            "$TOOLS/apksigner" verify --verbose --print-certs "$FILE" > "$WORK/signature.txt" 2>&1
          else
            jarsigner -keystore "$KS" -storepass "$KS_PASS" -keypass "$KS_PASS" "$FILE" "$KS_ALIAS" > "$WORK/signature.txt" 2>&1
            jarsigner -verify "$FILE" >> "$WORK/signature.txt" 2>&1
          fi
          cat "$WORK/signature.txt"
          python3 - "$FILE" "$WORK/signature.txt" "$OUT" <<'PY'
          import hashlib,json,os,sys,datetime
          f,report,out=sys.argv[1:]; digest=hashlib.sha256(open(f,'rb').read()).hexdigest()
          result={'verified':True,'artifact':os.path.basename(f),'sha256':digest,'signature_report':open(report,encoding='utf-8',errors='replace').read()[:4000],'build_id':os.environ.get('GITHUB_RUN_ID',''),'verified_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          open(os.path.join(out,'verification.json'),'w',encoding='utf-8').write(json.dumps(result,indent=2))
          open(os.path.join(out,'sha256.txt'),'w',encoding='utf-8').write(digest+'  '+os.path.basename(f)+'\n')
          print(json.dumps(result,indent=2))
          PY

      - name: Upload verified Android package
        uses: actions/upload-artifact@v7
        with:
          name: android-package
          path: ${{ github.workspace }}/out
          retention-days: 7
          if-no-files-found: error

